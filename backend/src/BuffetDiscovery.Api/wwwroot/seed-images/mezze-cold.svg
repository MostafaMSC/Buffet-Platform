<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Cold mezze with hummus, fattoush and tabbouleh">
  <title>Mezze — Hummus, Fattoush &amp; Tabbouleh</title>
  <defs>
    <linearGradient id="bg16" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef7e6"/>
      <stop offset="1" stop-color="#cfe6b0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg16)"/>

  <!-- hummus bowl -->
  <g transform="translate(250,340)">
    <ellipse rx="120" ry="42" fill="#ffffff"/>
    <ellipse cy="-8" rx="95" ry="30" fill="#e8d29a"/>
    <path d="M -40 -14 q 40 -14 80 0" stroke="#c8451f" stroke-width="4" fill="none" opacity="0.7"/>
    <circle cx="-10" cy="-10" r="6" fill="#c8451f"/>
    <g fill="#4f7a3a">
      <ellipse cx="40" cy="-20" rx="8" ry="14" transform="rotate(20 40 -20)"/>
    </g>
  </g>

  <!-- tabbouleh -->
  <g transform="translate(550,300)">
    <ellipse rx="110" ry="40" fill="#ffffff"/>
    <ellipse cy="-6" rx="88" ry="28" fill="#7ea34a"/>
    <g fill="#c8451f">
      <circle cx="-30" cy="-8" r="7"/><circle cx="10" cy="-14" r="7"/><circle cx="40" cy="0" r="7"/>
    </g>
    <g fill="#f4e04d">
      <circle cx="-10" cy="4" r="5"/><circle cx="30" cy="-4" r="5"/>
    </g>
  </g>

  <!-- fattoush -->
  <g transform="translate(450,440)">
    <ellipse rx="140" ry="45" fill="#ffffff"/>
    <ellipse cy="-8" rx="112" ry="32" fill="#8fa85a"/>
    <g fill="#c8451f">
      <circle cx="-50" cy="-10" r="8"/><circle cx="0" cy="-16" r="8"/><circle cx="50" cy="-6" r="8"/>
    </g>
    <g fill="#e8d29a">
      <rect x="-30" y="-4" width="18" height="10" rx="3" transform="rotate(15 -30 -4)"/>
      <rect x="20" y="0" width="18" height="10" rx="3" transform="rotate(-10 20 0)"/>
    </g>
  </g>
</svg>
