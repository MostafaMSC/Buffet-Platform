<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Candlelit romantic dinner for two with steak, pasta and wine">
  <title>Romantic Dinner for Two</title>
  <defs>
    <radialGradient id="bg11" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#4a2036"/>
      <stop offset="1" stop-color="#1e0f1c"/>
    </radialGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg11)"/>

  <!-- steak plate -->
  <g transform="translate(280,360)">
    <circle r="130" fill="#f3ede0" opacity="0.95"/>
    <ellipse cy="10" rx="80" ry="45" fill="#7a3218"/>
    <ellipse cy="0" rx="70" ry="38" fill="#9a4a28"/>
    <g stroke="#5c2410" stroke-width="4" opacity="0.6">
      <line x1="-45" y1="-10" x2="45" y2="-10"/>
      <line x1="-45" y1="10" x2="45" y2="10"/>
    </g>
    <g fill="#4f7a3a">
      <ellipse cx="70" cy="-40" rx="10" ry="18" transform="rotate(30 70 -40)"/>
      <ellipse cx="85" cy="-25" rx="10" ry="18" transform="rotate(-10 85 -25)"/>
    </g>
  </g>

  <!-- pasta plate -->
  <g transform="translate(560,360)">
    <circle r="130" fill="#f3ede0" opacity="0.95"/>
    <g fill="#f4d878">
      <path d="M -60 20 q 20 -50 60 -40 q -30 30 0 60 q -50 10 -60 -20 Z"/>
      <path d="M -20 30 q 30 -40 60 -20 q -20 30 5 45 q -45 5 -65 -25 Z"/>
    </g>
    <circle cx="0" cy="0" r="18" fill="#c8451f" opacity="0.8"/>
    <g fill="#4f7a3a">
      <ellipse cx="30" cy="-30" rx="8" ry="14" transform="rotate(20 30 -30)"/>
    </g>
  </g>

  <!-- candle -->
  <g transform="translate(450,290)">
    <rect x="-14" y="-10" width="28" height="70" rx="6" fill="#f2e8c8"/>
    <ellipse cy="-16" rx="6" ry="10" fill="#ffb347"/>
    <ellipse cy="-14" rx="3" ry="6" fill="#fff3d0"/>
  </g>

  <!-- wine glasses -->
  <g transform="translate(150,420)" fill="none" stroke="#d8c9d0" stroke-width="4">
    <path d="M -14 -40 L 14 -40 L 6 0 L -6 0 Z" fill="#8e2140" opacity="0.7"/>
    <line x1="0" y1="0" x2="0" y2="30"/>
    <line x1="-16" y1="30" x2="16" y2="30"/>
  </g>
  <g transform="translate(700,420)" fill="none" stroke="#d8c9d0" stroke-width="4">
    <path d="M -14 -40 L 14 -40 L 6 0 L -6 0 Z" fill="#8e2140" opacity="0.7"/>
    <line x1="0" y1="0" x2="0" y2="30"/>
    <line x1="-16" y1="30" x2="16" y2="30"/>
  </g>
</svg>
