<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Arabic dessert platter with kunafa and baklava">
  <title>Arabic Desserts — Kunafa &amp; Baklava</title>
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d0"/>
      <stop offset="1" stop-color="#f4d888"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg9)"/>

  <ellipse cx="450" cy="380" rx="340" ry="130" fill="#ffffff" stroke="#eccf94" stroke-width="8"/>

  <!-- kunafa tray -->
  <g transform="translate(320,340)">
    <rect x="-130" y="-40" width="260" height="80" rx="8" fill="#e8a53c"/>
    <g fill="#f4c542">
      <rect x="-120" y="-32" width="55" height="64"/>
      <rect x="-58" y="-32" width="55" height="64"/>
      <rect x="4" y="-32" width="55" height="64"/>
      <rect x="66" y="-32" width="55" height="64"/>
    </g>
    <g stroke="#c8862a" stroke-width="3">
      <line x1="-65" y1="-32" x2="-65" y2="32"/>
      <line x1="-3" y1="-32" x2="-3" y2="32"/>
      <line x1="59" y1="-32" x2="59" y2="32"/>
    </g>
    <g fill="#7a9a4a">
      <circle cx="-92" cy="-38" r="4"/><circle cx="-30" cy="-38" r="4"/><circle cx="32" cy="-38" r="4"/><circle cx="94" cy="-38" r="4"/>
    </g>
  </g>

  <!-- baklava stack -->
  <g transform="translate(620,350)">
    <path d="M -70 30 L 0 -50 L 70 30 Z" fill="#d99a3c"/>
    <path d="M -50 30 L 0 -25 L 50 30 Z" fill="#e8b866"/>
    <g stroke="#b9803c" stroke-width="3">
      <line x1="-50" y1="30" x2="0" y2="-25"/>
      <line x1="50" y1="30" x2="0" y2="-25"/>
      <line x1="-25" y1="2" x2="25" y2="2"/>
    </g>
    <g fill="#7a9a4a">
      <circle cx="-20" cy="10" r="4"/><circle cx="0" cy="-4" r="4"/><circle cx="20" cy="10" r="4"/>
    </g>
  </g>

  <!-- honey drizzle -->
  <path d="M 400 260 q 20 30 -10 60" stroke="#e8a53c" stroke-width="5" fill="none" opacity="0.7" stroke-linecap="round"/>
</svg>
