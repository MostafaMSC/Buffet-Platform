<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Kurdish lamb shank with dolma and kubba">
  <title>Kurdish Lamb &amp; Dolma</title>
  <defs>
    <linearGradient id="bg12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe8d8"/>
      <stop offset="1" stop-color="#e8b98c"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg12)"/>

  <ellipse cx="450" cy="370" rx="330" ry="140" fill="#ffffff" stroke="#dfb98a" stroke-width="8"/>

  <!-- lamb shank -->
  <g transform="translate(560,320)">
    <path d="M -60 30 Q -80 -20 -20 -50 Q 50 -75 90 -30 Q 105 0 65 30 Q 25 55 -25 55 Q -50 55 -60 30 Z" fill="#9a5a2c"/>
    <rect x="70" y="-15" width="60" height="22" rx="8" fill="#e6dcc8"/>
    <path d="M -40 15 Q -10 -20 40 -25" stroke="#7a3f18" stroke-width="5" fill="none" opacity="0.6"/>
  </g>

  <!-- dolma rolls -->
  <g fill="#5c7a34">
    <rect x="250" y="330" width="70" height="26" rx="13"/>
    <rect x="250" y="365" width="70" height="26" rx="13"/>
    <rect x="330" y="345" width="70" height="26" rx="13"/>
    <rect x="250" y="400" width="70" height="26" rx="13"/>
  </g>
  <g stroke="#3f5a20" stroke-width="2" opacity="0.5">
    <line x1="260" y1="343" x2="310" y2="343"/>
    <line x1="260" y1="378" x2="310" y2="378"/>
    <line x1="340" y1="358" x2="390" y2="358"/>
  </g>

  <!-- kubba -->
  <g fill="#c98a3a">
    <ellipse cx="420" cy="420" rx="34" ry="24"/>
    <ellipse cx="470" cy="410" rx="34" ry="24"/>
  </g>
  <g fill="#a5652b" opacity="0.5">
    <ellipse cx="420" cy="415" rx="22" ry="12"/>
    <ellipse cx="470" cy="405" rx="22" ry="12"/>
  </g>
</svg>
