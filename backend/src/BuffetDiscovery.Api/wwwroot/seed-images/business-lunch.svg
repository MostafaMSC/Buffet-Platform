<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Plated business lunch with salad, grilled chicken and dessert">
  <title>Business Lunch</title>
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7f2"/>
      <stop offset="1" stop-color="#e4e7dc"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg10)"/>

  <!-- starter plate -->
  <g transform="translate(180,340)">
    <circle r="110" fill="#ffffff" stroke="#e0e2d8" stroke-width="6"/>
    <ellipse cy="10" rx="70" ry="30" fill="#c9822e" opacity="0.5"/>
    <g fill="#7ea34a">
      <ellipse cx="-20" cy="-10" rx="22" ry="14"/>
      <ellipse cx="15" cy="0" rx="24" ry="15"/>
      <ellipse cx="-5" cy="20" rx="20" ry="12"/>
    </g>
    <circle cx="10" cy="-6" r="8" fill="#e8735a"/>
  </g>

  <!-- main plate -->
  <g transform="translate(450,320)">
    <circle r="140" fill="#ffffff" stroke="#e0e2d8" stroke-width="7"/>
    <ellipse cy="20" rx="90" ry="35" fill="#f6efd8"/>
    <ellipse cx="-10" cy="-10" rx="60" ry="34" fill="#d99a5c"/>
    <g stroke="#b97a3c" stroke-width="4" opacity="0.6">
      <line x1="-50" y1="-20" x2="-20" y2="0"/>
      <line x1="-30" y1="-25" x2="0" y2="-5"/>
      <line x1="-10" y1="-25" x2="20" y2="-5"/>
    </g>
    <g fill="#4f7a3a">
      <ellipse cx="55" cy="10" rx="10" ry="18" transform="rotate(20 55 10)"/>
      <ellipse cx="70" cy="25" rx="10" ry="18" transform="rotate(-10 70 25)"/>
    </g>
  </g>

  <!-- dessert plate -->
  <g transform="translate(700,370)">
    <circle r="80" fill="#ffffff" stroke="#e0e2d8" stroke-width="5"/>
    <rect x="-30" y="-26" width="60" height="52" rx="8" fill="#5c3a24"/>
    <rect x="-30" y="-26" width="60" height="14" rx="4" fill="#7a4e30"/>
  </g>

  <!-- cutlery -->
  <g stroke="#b7bcae" stroke-width="6" stroke-linecap="round">
    <line x1="330" y1="230" x2="330" y2="420"/>
    <line x1="580" y1="220" x2="580" y2="420"/>
  </g>
</svg>
