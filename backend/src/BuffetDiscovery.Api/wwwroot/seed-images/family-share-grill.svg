<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Shared family platter with mixed grill, biryani and kunafa">
  <title>Family Sharing Platter</title>
  <defs>
    <linearGradient id="bg17" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdeed6"/>
      <stop offset="1" stop-color="#eec684"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg17)"/>

  <ellipse cx="450" cy="370" rx="380" ry="150" fill="#ffffff" stroke="#e3c48a" stroke-width="8"/>

  <!-- rice section -->
  <ellipse cx="330" cy="360" rx="140" ry="80" fill="#f4c542"/>
  <g fill="#f7d878">
    <circle cx="280" cy="340" r="6"/><circle cx="320" cy="325" r="6"/><circle cx="360" cy="335" r="6"/>
    <circle cx="300" cy="370" r="6"/><circle cx="350" cy="380" r="6"/>
  </g>

  <!-- grilled skewers on top -->
  <g transform="translate(300,330) rotate(-8)">
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#c8c8c8" stroke-width="6"/>
    <ellipse cx="-50" cy="-6" rx="24" ry="16" fill="#7a3218"/>
    <ellipse cx="0" cy="-8" rx="24" ry="16" fill="#8a3a24"/>
    <ellipse cx="50" cy="-6" rx="24" ry="16" fill="#7a3218"/>
  </g>

  <!-- kunafa corner -->
  <g transform="translate(620,390)">
    <rect x="-70" y="-30" width="140" height="60" rx="8" fill="#e8a53c"/>
    <g fill="#f4c542">
      <rect x="-60" y="-22" width="30" height="44"/>
      <rect x="-26" y="-22" width="30" height="44"/>
      <rect x="8" y="-22" width="30" height="44"/>
      <rect x="42" y="-22" width="30" height="44"/>
    </g>
    <g fill="#7a9a4a">
      <circle cx="-45" cy="-26" r="3"/><circle cx="-11" cy="-26" r="3"/><circle cx="23" cy="-26" r="3"/><circle cx="57" cy="-26" r="3"/>
    </g>
  </g>

  <!-- herbs garnish -->
  <g fill="#4f7a3a">
    <ellipse cx="450" cy="460" rx="10" ry="18" transform="rotate(20 450 460)"/>
    <ellipse cx="470" cy="470" rx="10" ry="18" transform="rotate(-10 470 470)"/>
  </g>
</svg>
