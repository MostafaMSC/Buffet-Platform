<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Saffron rice, grilled vegetables and pickles side dishes">
  <title>Rice &amp; Sides</title>
  <defs>
    <linearGradient id="bg15" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f7e0"/>
      <stop offset="1" stop-color="#d9e8b0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg15)"/>

  <!-- rice bowl -->
  <g transform="translate(280,340)">
    <ellipse rx="150" ry="55" fill="#ffffff"/>
    <ellipse cy="-14" rx="120" ry="42" fill="#f4c542"/>
    <g fill="#f7d878">
      <circle cx="-50" cy="-16" r="7"/><circle cx="0" cy="-26" r="7"/><circle cx="50" cy="-16" r="7"/>
      <circle cx="-25" cy="0" r="7"/><circle cx="25" cy="4" r="7"/>
    </g>
  </g>

  <!-- grilled vegetable skewer -->
  <g transform="translate(560,300)">
    <line x1="-100" y1="20" x2="100" y2="-10" stroke="#c8c8c8" stroke-width="6"/>
    <circle cx="-60" cy="14" r="22" fill="#c8451f"/>
    <circle cx="-10" cy="6" r="22" fill="#e8b866"/>
    <circle cx="40" cy="-2" r="22" fill="#7ea34a"/>
    <circle cx="80" cy="-8" r="22" fill="#c8451f"/>
  </g>

  <!-- torshi pickles jar -->
  <g transform="translate(600,440)">
    <rect x="-40" y="-50" width="80" height="90" rx="14" fill="#e8f0d0" opacity="0.8"/>
    <rect x="-32" y="-30" width="20" height="60" rx="8" fill="#c8451f"/>
    <rect x="-4" y="-20" width="20" height="50" rx="8" fill="#7ea34a"/>
    <rect x="20" y="-35" width="18" height="65" rx="8" fill="#e8b866"/>
  </g>
</svg>
