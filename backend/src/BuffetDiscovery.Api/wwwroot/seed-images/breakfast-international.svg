<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="International breakfast buffet spread">
  <title>International Breakfast Buffet</title>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6e6"/>
      <stop offset="1" stop-color="#ffe8c2"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg1)"/>
  <ellipse cx="450" cy="500" rx="420" ry="60" fill="#e8c99a" opacity="0.5"/>

  <!-- plate with fried egg -->
  <circle cx="270" cy="330" r="150" fill="#ffffff" stroke="#f0dcb8" stroke-width="6"/>
  <circle cx="270" cy="330" r="118" fill="#fffdf7"/>
  <circle cx="250" cy="320" r="55" fill="#fff2c8"/>
  <circle cx="250" cy="320" r="26" fill="#f7b733"/>
  <circle cx="310" cy="360" r="46" fill="#fff2c8"/>
  <circle cx="310" cy="360" r="20" fill="#f7b733"/>
  <ellipse cx="220" cy="270" rx="18" ry="10" fill="#8fbf6c"/>
  <ellipse cx="330" cy="255" rx="14" ry="9" fill="#8fbf6c"/>

  <!-- croissant -->
  <g transform="translate(500,240) rotate(-10)">
    <path d="M -60 20 C -70 -30 -20 -55 20 -40 C 55 -28 65 10 40 35 C 15 55 -20 45 -40 55 C -55 62 -55 40 -60 20 Z" fill="#d99a3c"/>
    <path d="M -50 15 C -55 -15 -20 -35 10 -25" stroke="#b97a24" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M -20 30 C 0 20 15 5 25 -10" stroke="#b97a24" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- fruit slices -->
  <g transform="translate(640,380)">
    <circle r="45" fill="#f7941d"/>
    <circle r="34" fill="#ffb347"/>
    <g stroke="#fff3e0" stroke-width="3">
      <line x1="-30" y1="0" x2="30" y2="0"/>
      <line x1="-21" y1="-21" x2="21" y2="21"/>
      <line x1="-21" y1="21" x2="21" y2="-21"/>
      <line x1="0" y1="-30" x2="0" y2="30"/>
    </g>
  </g>
  <g transform="translate(700,330)">
    <circle r="24" fill="#8e2140"/>
    <circle r="16" fill="#c1416a"/>
  </g>

  <!-- coffee cup -->
  <g transform="translate(150,470)">
    <rect x="-45" y="-10" width="90" height="60" rx="10" fill="#ffffff" stroke="#e0c9a0" stroke-width="4"/>
    <ellipse cx="0" cy="-10" rx="45" ry="12" fill="#5a3421"/>
    <path d="M 45 -5 q 30 5 5 30" stroke="#e0c9a0" stroke-width="6" fill="none"/>
  </g>
</svg>
