<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Chicken biryani and beef tashreeb bread stew">
  <title>Biryani &amp; Tashreeb</title>
  <defs>
    <linearGradient id="bg13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0da"/>
      <stop offset="1" stop-color="#f0c26a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg13)"/>

  <!-- biryani plate -->
  <g transform="translate(280,340)">
    <circle r="150" fill="#ffffff" stroke="#e8cf9e" stroke-width="7"/>
    <ellipse cy="10" rx="110" ry="60" fill="#f4c542"/>
    <g fill="#f7d878">
      <circle cx="-40" cy="-10" r="6"/><circle cx="0" cy="-20" r="6"/><circle cx="40" cy="-10" r="6"/>
      <circle cx="-20" cy="10" r="6"/><circle cx="20" cy="15" r="6"/><circle cx="60" cy="20" r="6"/>
    </g>
    <ellipse cx="10" cy="-10" rx="45" ry="26" fill="#c8813f"/>
    <g fill="#a56528" opacity="0.6">
      <ellipse cx="0" cy="-20" rx="14" ry="8"/>
      <ellipse cx="30" cy="-6" rx="14" ry="8"/>
    </g>
  </g>

  <!-- tashreeb bowl -->
  <g transform="translate(620,360)">
    <ellipse rx="130" ry="45" fill="#eee3cf"/>
    <ellipse cy="-14" rx="105" ry="34" fill="#a5652b"/>
    <g fill="#8a5228">
      <rect x="-60" y="-24" width="34" height="20" rx="4"/>
      <rect x="-10" y="-20" width="34" height="20" rx="4"/>
      <rect x="40" y="-26" width="34" height="20" rx="4"/>
    </g>
    <g fill="#c8451f">
      <ellipse cx="-40" cy="-6" rx="10" ry="7"/>
      <ellipse cx="20" cy="-4" rx="10" ry="7"/>
    </g>
  </g>
</svg>
