<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Levantine breakfast mezze with manakish, labneh and olives">
  <title>Levantine Breakfast</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f7e8"/>
      <stop offset="1" stop-color="#dfeccb"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg2)"/>

  <!-- manakish flatbread -->
  <circle cx="330" cy="300" r="170" fill="#e8b866"/>
  <circle cx="330" cy="300" r="150" fill="#efc987"/>
  <g fill="#7a8b3f">
    <circle cx="270" cy="250" r="6"/><circle cx="300" cy="230" r="6"/><circle cx="340" cy="245" r="6"/>
    <circle cx="380" cy="270" r="6"/><circle cx="360" cy="320" r="6"/><circle cx="310" cy="340" r="6"/>
    <circle cx="270" cy="320" r="6"/><circle cx="400" cy="320" r="6"/><circle cx="330" cy="290" r="6"/>
    <circle cx="250" cy="290" r="6"/><circle cx="380" cy="230" r="6"/>
  </g>
  <path d="M330 150 A150 150 0 0 1 480 300" fill="none" stroke="#c8451f" stroke-width="10" opacity="0.4"/>

  <!-- labneh bowl -->
  <g transform="translate(610,240)">
    <ellipse cx="0" cy="30" rx="90" ry="30" fill="#c9dba8"/>
    <ellipse cx="0" cy="10" rx="80" ry="45" fill="#ffffff"/>
    <ellipse cx="0" cy="0" rx="60" ry="25" fill="#fdfaf3"/>
    <circle cx="-10" cy="-4" r="4" fill="#c8451f"/>
    <circle cx="15" cy="4" r="4" fill="#c8451f"/>
    <circle cx="0" cy="-10" r="4" fill="#7a8b3f"/>
  </g>

  <!-- olives -->
  <g transform="translate(560,410)">
    <ellipse rx="70" ry="24" fill="#d9d3b8"/>
    <circle cx="-30" cy="0" r="12" fill="#3b3b1f"/>
    <circle cx="0" cy="-4" r="12" fill="#586b2d"/>
    <circle cx="30" cy="2" r="12" fill="#3b3b1f"/>
    <circle cx="-10" cy="8" r="12" fill="#586b2d"/>
  </g>

  <!-- za'atar dish -->
  <g transform="translate(200,460)">
    <ellipse rx="55" ry="18" fill="#a3b578"/>
    <ellipse rx="42" ry="12" fill="#5c6b2e"/>
  </g>
</svg>
