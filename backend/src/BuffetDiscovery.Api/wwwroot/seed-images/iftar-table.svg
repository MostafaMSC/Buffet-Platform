<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Ramadan iftar table with dates, lentil soup and mezze">
  <title>Ramadan Iftar Table</title>
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a5c"/>
      <stop offset="1" stop-color="#1c1233"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg8)"/>

  <!-- crescent moon -->
  <path d="M 760 90 A 50 50 0 1 0 780 180 A 38 38 0 1 1 760 90 Z" fill="#f4d878"/>
  <g fill="#f4d878">
    <circle cx="700" cy="130" r="3"/><circle cx="680" cy="160" r="2"/><circle cx="820" cy="110" r="2"/>
  </g>

  <!-- table -->
  <ellipse cx="450" cy="420" rx="380" ry="130" fill="#d8b06a" opacity="0.9"/>

  <!-- dates bowl -->
  <g transform="translate(280,370)">
    <ellipse rx="90" ry="30" fill="#8a5a2c"/>
    <ellipse cy="-8" rx="80" ry="26" fill="#a5713c"/>
    <g fill="#4a2a12">
      <ellipse cx="-30" cy="-10" rx="16" ry="9"/>
      <ellipse cx="0" cy="-14" rx="16" ry="9"/>
      <ellipse cx="30" cy="-9" rx="16" ry="9"/>
      <ellipse cx="-12" cy="-2" rx="16" ry="9"/>
      <ellipse cx="18" cy="-1" rx="16" ry="9"/>
    </g>
  </g>

  <!-- soup bowl -->
  <g transform="translate(500,400)">
    <ellipse rx="90" ry="30" fill="#eee3cf"/>
    <ellipse cy="-10" rx="72" ry="22" fill="#c9822e"/>
    <circle cx="-20" cy="-12" r="5" fill="#8a5a2c"/>
    <circle cx="10" cy="-8" r="5" fill="#8a5a2c"/>
  </g>

  <!-- small mezze dishes -->
  <g transform="translate(650,440)">
    <ellipse rx="55" ry="18" fill="#f2f2e6"/>
    <ellipse cy="-4" rx="42" ry="12" fill="#8fa85a"/>
  </g>
  <g transform="translate(190,450)">
    <ellipse rx="50" ry="16" fill="#f2f2e6"/>
    <ellipse cy="-4" rx="38" ry="10" fill="#c8451f"/>
  </g>

  <!-- lantern -->
  <g transform="translate(120,220)">
    <path d="M -18 -40 L 18 -40 L 24 40 L -24 40 Z" fill="#3a2a5c" stroke="#f4d878" stroke-width="3"/>
    <ellipse cy="-42" rx="10" ry="6" fill="#f4d878"/>
    <ellipse cy="42" rx="14" ry="6" fill="#f4d878"/>
    <circle cy="0" r="10" fill="#f4d878" opacity="0.8"/>
  </g>
</svg>
