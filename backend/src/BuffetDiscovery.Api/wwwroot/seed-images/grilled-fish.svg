<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Whole grilled masgouf fish with lemon and herbs">
  <title>Grilled River Fish</title>
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcefff"/>
      <stop offset="1" stop-color="#a9d3ec"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg6)"/>

  <ellipse cx="450" cy="330" rx="330" ry="140" fill="#ffffff" opacity="0.9"/>

  <!-- fish body -->
  <g transform="translate(450,320)">
    <path d="M -280 0 Q -150 -110 50 -60 Q 220 -20 280 0 Q 220 20 50 60 Q -150 110 -280 0 Z" fill="#c8813f"/>
    <path d="M 240 0 L 320 -50 L 300 0 L 320 50 Z" fill="#a5652b"/>
    <circle cx="-210" cy="-8" r="12" fill="#3a2415"/>
    <circle cx="-206" cy="-11" r="4" fill="#fff"/>
    <g stroke="#a5652b" stroke-width="6" opacity="0.7">
      <line x1="-150" y1="-40" x2="-120" y2="40"/>
      <line x1="-90" y1="-55" x2="-60" y2="55"/>
      <line x1="-30" y1="-58" x2="0" y2="58"/>
      <line x1="30" y1="-50" x2="55" y2="50"/>
      <line x1="90" y1="-35" x2="105" y2="35"/>
    </g>
    <path d="M -230 -50 Q -180 -90 -100 -80" stroke="#8a5228" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- lemon wedge -->
  <g transform="translate(700,420) rotate(20)">
    <path d="M -40 0 A 40 40 0 0 1 40 0 Z" fill="#f4e04d" stroke="#d8c22f" stroke-width="4"/>
    <g stroke="#fff8d6" stroke-width="3">
      <line x1="0" y1="0" x2="-30" y2="-6"/>
      <line x1="0" y1="0" x2="0" y2="-14"/>
      <line x1="0" y1="0" x2="30" y2="-6"/>
    </g>
  </g>

  <!-- herbs -->
  <g fill="#4f7a3a">
    <ellipse cx="220" cy="440" rx="10" ry="20" transform="rotate(20 220 440)"/>
    <ellipse cx="245" cy="450" rx="10" ry="20" transform="rotate(-10 245 450)"/>
    <ellipse cx="200" cy="460" rx="10" ry="20" transform="rotate(40 200 460)"/>
  </g>
</svg>
