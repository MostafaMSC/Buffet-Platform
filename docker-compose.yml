services:
  postgres:
    image: postgres:16
    container_name: buffet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: buffet
      POSTGRES_PASSWORD: buffet_dev_pw
      POSTGRES_DB: buffet_discovery
    ports:
      # Host port 5433 (not 5432) so this doesn't collide with a native/local
      # Postgres install already running on the default port. The container
      # still listens on 5432 internally.
      - "5433:5432"
    volumes:
      - buffet_pgdata:/var/lib/postgresql/data

volumes:
  buffet_pgdata:
